<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도입 문의 | CUSMOS</title>
<meta name="description" content="커즈모스 솔루션 도입과 제휴를 문의해 주세요.">
<link rel="icon" href="assets/img/logo-symbol.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumb reveal"><span>홈</span><span>/</span><span>도입 문의</span></div>
      <h1 class="reveal d1">도입 문의</h1>
      <p class="reveal d2">설치하려는 장소와 해결하고 싶은 문제를 적어 주시면 담당자가 확인 후 연락드립니다.</p>
    </div>
  </section>
  <section class="light" style="padding:clamp(56px,7vw,100px) 0 clamp(96px,10vw,160px)">
    <div class="wrap">
      <div class="split top" style="grid-template-columns:1fr 2fr">
        <dl class="contact-info" id="info"></dl>
        <form class="form" id="form">
          <div><label for="org">기관·회사명</label><input id="org" required></div>
          <div><label for="name">담당자</label><input id="name" required></div>
          <div><label for="tel">연락처</label><input id="tel" type="tel"></div>
          <div><label for="mail">이메일</label><input id="mail" type="email" required></div>
          <div class="full"><label for="topic">관심 솔루션</label>
            <select id="topic"><option>스마트시티 소음 관측</option><option>산업안전 이상음 탐지</option><option>휴대용 초음파 카메라</option><option>기타·제휴</option></select></div>
          <div class="full"><label for="msg">문의 내용</label><textarea id="msg" required placeholder="설치 장소, 대상 소음, 예상 규모 등을 적어 주세요."></textarea></div>
          <div class="full"><button class="btn" style="background:var(--ink);color:#fff" type="submit">메일로 보내기 <i class="arr"></i></button>
            <p class="note" style="margin-top:12px">버튼을 누르면 사용하시는 메일 프로그램이 열리고, 적은 내용이 채워집니다.</p></div>
        </form>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/common.js?v=2"></script>
<script>
  getData("site", {}).then((s) => {
    const rows = [["이메일", s.email], ["전화", s.phone], ["주소", s.address]];
    document.getElementById("info").innerHTML = rows.map((r) => `<div><dt>${r[0]}</dt><dd>${r[1] ? esc(r[1]) : '<span style="color:#9aa0b5;font-weight:400">준비 중입니다</span>'}</dd></div>`).join("");
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!s.email) return alert("문의 메일 주소를 준비하고 있습니다. 잠시 후 다시 시도해 주세요.");
      const v = (id) => document.getElementById(id).value.trim();
      const body = `기관·회사명: ${v("org")}\n담당자: ${v("name")}\n연락처: ${v("tel")}\n이메일: ${v("mail")}\n관심 솔루션: ${v("topic")}\n\n${v("msg")}`;
      location.href = `mailto:${s.email}?subject=${encodeURIComponent(`[도입 문의] ${v("org")}`)}&body=${encodeURIComponent(body)}`;
    });
  });
</script>
</body>
</html>
