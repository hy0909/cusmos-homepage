<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>언어별 개선 전후 비교 | CUSMOS</title>
<link rel="icon" href="../assets/img/logo-symbol.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 개선 전(현재 사이트)과 개선 후(프로토타입) 메인 페이지를 버튼으로 바꿔 보는 화면 */
  :root {
    --navy: #05060d; --ink: #0b0c17; --muted: #4a4f68; --line: #e3e5ee; --bg: #f5f6fa;
    --violet: #a46bff; --pink: #f45fc8; --sky: #7fa8ff;
    --grad: linear-gradient(100deg, #7fa8ff 0%, #a46bff 45%, #f45fc8 100%);
    --bar-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 "Pretendard Variable", Pretendard, system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }

  /* 상단 조작 막대 */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; background: var(--navy); color: #fff; }
  .bar h1 { margin: 0 8px 0 0; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .bar h1 span { color: #9ba1bb; font-weight: 500; margin-left: 6px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #c9cde0; font-size: 14px; font-weight: 600; }
  .seg button:hover { color: #fff; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .seg.mode button[aria-pressed="true"][data-mode="after"] { background: var(--grad); color: #fff; }
  .seg.mode button[aria-pressed="true"][data-mode="fable"] { background: var(--navy); color: #fff; box-shadow: inset 0 0 0 2px var(--violet); }
  .spacer { flex: 1; }
  .ghost { height: 36px; padding: 0 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; background: transparent; color: #fff; font-size: 14px; font-weight: 600; }
  .ghost[aria-pressed="true"] { background: rgba(255,255,255,.14); }
  .hint { width: 100%; font-size: 12px; color: #9ba1bb; }
  .hint kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; text-align: center; font: 11px/18px system-ui; color: #fff; }

  /* 화면 영역 */
  .stage { flex: 1; min-height: 0; display: flex; }
  .views { flex: 1; min-width: 0; display: grid; gap: 12px; padding: 12px; }
  .views.split { grid-template-columns: 1fr 1fr 1fr; }
  .view { position: relative; min-height: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .view[hidden] { display: none; }
  .view header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #eceef4; color: var(--muted); }
  .tag.after { background: var(--grad); color: #fff; }
  .tag.fable { background: var(--navy); color: #fff; box-shadow: inset 0 0 0 1.5px var(--violet); }
  .view header a { color: var(--muted); text-decoration: none; }
  .view header a:hover { color: var(--ink); }
  .frame { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #e9eaf0; }
  .frame iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; transform-origin: 0 0; }
  .frame.mobile iframe { left: 50%; top: 16px; border-radius: 22px; box-shadow: 0 0 0 10px var(--navy), 0 20px 40px rgba(5,6,13,.25); }

  /* 변경 내용 패널 */
  .panel { width: 420px; flex: none; overflow-y: auto; background: #fff; border-left: 1px solid var(--line); padding: 20px; }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0 0 4px; font-size: 18px; }
  .panel .lead { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .sum div { padding: 10px; border-radius: 10px; background: var(--bg); }
  .sum b { display: block; font-size: 18px; }
  .sum span { font-size: 12px; color: var(--muted); }
  .panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .panel th, .panel td { text-align: left; vertical-align: top; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  .panel th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .panel td:first-child { font-weight: 700; white-space: nowrap; }
  .lv { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #eceef4; color: var(--muted); }
  .lv.hi { background: #ffe6f6; color: #c2289a; }
  .lv.md { background: #f1eaff; color: #7a45e6; }
  .src { margin-top: 16px; font-size: 12px; color: var(--muted); }
  .panel h3 { margin: 22px 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .panel h3 .tag { height: 20px; font-size: 11px; }
  @media (max-width: 1100px) { .panel { position: fixed; right: 0; top: var(--bar-h); bottom: 0; z-index: 5; box-shadow: -10px 0 30px rgba(5,6,13,.15); } }
  @media (max-width: 760px) { .views.split { grid-template-columns: 1fr; } .panel { width: 100%; } }
</style>
</head>
<body>
<div class="bar" id="bar">
  <h1>CUSMOS 메인 페이지<span>언어별 개선 전후</span></h1>
  <div class="seg" role="group" aria-label="언어">
    <button data-lang="en" aria-pressed="true">English</button>
    <button data-lang="ja" aria-pressed="false">日本語</button>
    <button data-lang="de" aria-pressed="false">Deutsch</button>
  </div>
  <div class="seg mode" role="group" aria-label="보기">
    <button data-mode="before" aria-pressed="false">개선 전</button>
    <button data-mode="after" aria-pressed="true">개선 후</button>
    <button data-mode="fable" aria-pressed="false">Fable 개선</button>
    <button data-mode="split" aria-pressed="false">나란히</button>
  </div>
  <div class="seg" role="group" aria-label="화면 크기">
    <button data-device="desktop" aria-pressed="true">데스크톱</button>
    <button data-device="mobile" aria-pressed="false">모바일</button>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="toggle-panel" aria-pressed="true">변경 내용</button>
  <p class="hint">단축키 <kbd>B</kbd> 개선 전 <kbd>A</kbd> 개선 후 <kbd>F</kbd> Fable 개선 <kbd>S</kbd> 나란히 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 언어. 화면 안의 메뉴를 누르면 지금 사이트의 하위 페이지로 이동합니다.</p>
</div>

<div class="stage">
  <div class="views" id="views">
    <section class="view" id="v-before">
      <header><span class="tag">개선 전 · 현재 사이트</span><a id="open-before" target="_blank" rel="noopener">새 창 ↗</a></header>
      <div class="frame"><iframe title="개선 전 화면"></iframe></div>
    </section>
    <section class="view" id="v-after">
      <header><span class="tag after">개선 후 · 프로토타입</span><a id="open-after" target="_blank" rel="noopener">새 창 ↗</a></header>
      <div class="frame"><iframe title="개선 후 화면"></iframe></div>
    </section>
    <section class="view" id="v-fable">
      <header><span class="tag fable">Fable 개선 · 맥락 반영 시안</span><a id="open-fable" target="_blank" rel="noopener">새 창 ↗</a></header>
      <div class="frame"><iframe title="Fable 개선 화면"></iframe></div>
    </section>
  </div>
  <aside class="panel" id="panel" aria-label="변경 내용"></aside>
</div>

  const $ = (s) => document.querySelector(s);
  const DESKTOP_W = 1280, MOBILE_W = 390, MOBILE_H = 800;

  // before: 현재 사이트, after: 1차 프로토타입, fable: 전략 표를 다시 반영한 2차 시안
  function src(which) {
    if (which === "before") return `../${state.lang}/index.html`;
    if (which === "fable") return `${state.lang}/fable.html`;
    return `${state.lang}/index.html`;
  }

  // 데스크톱은 1280px로 그린 뒤 칸 너비에 맞게 줄이고, 모바일은 390px 실제 크기로 보여 준다
  function fit() {
    document.querySelectorAll(".frame").forEach((fr) => {
      const f = fr.querySelector("iframe");
      const W = fr.clientWidth, H = fr.clientHeight;
      fr.classList.toggle("mobile", state.device === "mobile");
      if (state.device === "mobile") {
        const s = Math.min(1, (H - 32) / MOBILE_H, (W - 32) / MOBILE_W);
        f.style.width = MOBILE_W + "px"; f.style.height = MOBILE_H + "px";
        f.style.transform = `translateX(-50%) scale(${s})`; f.style.transformOrigin = "50% 0";
      } else {
        const s = W / DESKTOP_W;
        f.style.width = DESKTOP_W + "px"; f.style.height = H / s + "px";
        f.style.transform = `scale(${s})`; f.style.transformOrigin = "0 0";
      }
    });
  }

  function load(which) {
    const f = $(`#v-${which} iframe`);
    const url = src(which);
    if (f.dataset.src !== url) { f.dataset.src = url; f.src = url; }
    $(`#open-${which}`).href = url;
  }

  function panel() {
    const p = PLAN[state.lang];
    $("#panel").hidden = !state.panel;
    $("#toggle-panel").setAttribute("aria-pressed", state.panel);
    $("#panel").innerHTML = `<h2>${p.name} · ${p.title}</h2><p class="lead">${p.lead}</p>
      <div class="sum">${p.sum.map((s) => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>
      <table><thead><tr><th>위치</th><th>개선</th><th>변경량</th></tr></thead><tbody>
      ${p.rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="lv ${r[2] === "대" ? "hi" : r[2] === "중" ? "md" : ""}">${r[2]}</span></td></tr>`).join("")}
      </tbody></table>
      ${(state.mode === "fable" || state.mode === "split") && p.fable ? `<h3><span class="tag fable">Fable 개선</span>${p.fable.title}</h3><p class="lead">${p.fable.lead}</p>
      <table><thead><tr><th>위치</th><th>1차 시안과 달라진 점</th><th>전략 표 항목</th></tr></thead><tbody>
      ${p.fable.rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
      </tbody></table>` : ""}
      <p class="src">근거: ${p.src}<br>자세한 내용: docs/localization-improvement-plan.md</p>`;
  }

  function render() {
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
    document.querySelectorAll("[data-device]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.device === state.device));
    $("#views").classList.toggle("split", state.mode === "split");
    const show = state.mode === "split" ? ["before", "after", "fable"] : [state.mode];
    ["before", "after", "fable"].forEach((w) => { $(`#v-${w}`).hidden = !show.includes(w); if (show.includes(w)) load(w); });
    panel();
    history.replaceState(null, "", `?lang=${state.lang}&mode=${state.mode}&device=${state.device}${state.panel ? "" : "&panel=0"}`);
    requestAnimationFrame(fit);
  }

  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; render(); }));
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); }));
  document.querySelectorAll("[data-device]").forEach((b) => b.addEventListener("click", () => { state.device = b.dataset.device; render(); }));
  $("#toggle-panel").addEventListener("click", () => { state.panel = !state.panel; render(); });
  addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select")) return;
    const k = e.key.toLowerCase();
    const map = { b: ["mode", "before"], a: ["mode", "after"], f: ["mode", "fable"], s: ["mode", "split"], 1: ["lang", "en"], 2: ["lang", "ja"], 3: ["lang", "de"], m: ["device", state.device === "mobile" ? "desktop" : "mobile"] };
    if (map[k]) { state[map[k][0]] = map[k][1]; render(); }
  });
  addEventListener("resize", fit);
  document.documentElement.style.setProperty("--bar-h", $("#bar").offsetHeight + "px");
  render();
</script>
</body>
</html>
