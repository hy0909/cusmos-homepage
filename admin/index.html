<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | CUSMOS</title>
<link rel="icon" href="../assets/img/logo-symbol.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="admin.css?v=6">
</head>
<body>
<!-- 로그인 -->
<div id="login" class="login" hidden>
  <div class="login-box">
    <div class="brand"><img src="../assets/img/logo-wordmark.png" alt="CUSMOS" class="word"></div>
    <h1>홈페이지 관리자</h1>
    <p class="sub">관리자 계정의 이메일과 비밀번호로 로그인합니다.</p>
    <form id="login-form" hidden>
      <div class="fld"><label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" placeholder="name@company.com" required></div>
      <div class="fld"><label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required></div>
      <button class="btn primary" type="submit" style="margin-top:20px">로그인</button>
      <button class="link" type="button" id="to-reset" style="margin-top:14px">비밀번호를 잊었어요</button>
    </form>
    <form id="reset-form" hidden>
      <label for="reset-email">가입한 이메일</label>
      <input id="reset-email" type="email" placeholder="name@company.com" required>
      <button class="btn primary" type="submit" style="margin-top:20px">재설정 메일 보내기</button>
      <p class="err" id="reset-msg" style="color:var(--ink-2)"></p>
      <button class="link" type="button" id="to-login">로그인으로 돌아가기</button>
    </form>
    <form id="newpw-form" hidden>
      <label for="newpw">새 비밀번호</label>
      <input id="newpw" type="password" autocomplete="new-password" minlength="8" placeholder="8자 이상" required>
      <button class="btn primary" type="submit" style="margin-top:20px">비밀번호 바꾸기</button>
      <p class="err" id="newpw-msg"></p>
    </form>
    <p class="err" id="login-err"></p>
  </div>
</div>

<!-- 관리 화면 -->
<div id="app" class="app" hidden>
  <aside class="side">
    <a class="brand" href="../ko/index.html" target="_blank" title="홈페이지 열기"><img src="../assets/img/logo-wordmark.png" alt="CUSMOS" class="word"></a>
    <nav id="menu"></nav>
    <div class="side-foot">
      <div class="deploy ok"><span class="dot"></span><span class="txt">저장하면 바로 반영</span></div>
      <div class="me" id="me"></div>
      <button class="link" id="logout">로그아웃</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js?v=5"></script>
<script src="../assets/js/common.js?v=5"></script>
<script src="admin.js?v=6"></script>
</body>
</html>
